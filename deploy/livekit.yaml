# LiveKit server for the local telephony stack. API keys are NOT set here:
# compose passes LIVEKIT_KEYS ("<key>: <secret>") from .env.
port: 7880
bind_addresses:
  - 127.0.0.1
log_level: info
redis:
  address: 127.0.0.1:6379
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
