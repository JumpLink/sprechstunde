[general]
static=yes
writeprotect=yes

; Runs on the LiveKit leg right before it dials: the line id goes along as a SIP header, which the
; inbound trunk turns into the participant attribute `sprechstunde.line` (provision.ts), so the
; agent learns which line was called and never sees a phone number.
[sprechstunde-line-header]
exten => s,1,Set(PJSIP_HEADER(add,X-Sprechstunde-Line)=${ARG1})
 same => n,Return()

; Calls arriving from the provider go to the LiveKit SIP bridge. SPRECHSTUNDE_LINE and
; SPRECHSTUNDE_LINE_NUMBER are set by the provider endpoint of the line that was called
; (pjsip.conf, `set_var`). The number must match what the LiveKit inbound trunk expects
; (provision.ts uses SPRECHSTUNDE_TRUNK_NUMBERS; empty = any number accepted).
[from-provider]
exten => _X.,1,NoOp(Inbound call on line ${SPRECHSTUNDE_LINE})
 same => n,Dial(PJSIP/${SPRECHSTUNDE_LINE_NUMBER}@livekit,${ENV(SPRECHSTUNDE_ANSWER_TIMEOUT)},b(sprechstunde-line-header^s^1(${SPRECHSTUNDE_LINE})))
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Answer()
 same => n,Wait(1)
 ; The profile's own announcement (`npm run fallback`) if recorded, else Asterisk's English one.
 same => n,Playback(${IF(${STAT(e,/opt/sprechstunde/sounds/fallback.wav)}?/opt/sprechstunde/sounds/fallback:ss-noservice)})
 same => n,Hangup()
 same => n(done),Hangup()

; Calls from LiveKit (REFER-initiated transfers) go out via the provider.
; LiveKit's REFER (to sip:<number>@127.0.0.1:5070) lands here; only the configured target is
; allowed. Reached a real mobile over 1&1.
[from-livekit]
; The transfer target arrives as the user part of "tel:+49…", so the dialled extension may start
; with "+" (which `_X.` does not match). TRANSFER_TARGET_NUMBER must be written the same way as
; the profile's transfer.target without the "tel:" prefix, digits only after an optional "+"
; (e.g. +4900000000). Both sides are compared after stripping a leading "+", so +49… and 49…
; are treated as the same number; the call goes out exactly as the target is configured.
exten => _[+0-9].,1,NoOp(From LiveKit -> ${EXTEN})
 same => n,Set(WANTED=${ENV(TRANSFER_TARGET_NUMBER)})
 same => n,Set(DIALLED_NORM=${IF($["${EXTEN:0:1}" = "+"]?${EXTEN:1}:${EXTEN})})
 same => n,Set(WANTED_NORM=${IF($["${WANTED:0:1}" = "+"]?${WANTED:1}:${WANTED})})
 same => n,GotoIf($["${WANTED_NORM}" != "" & "${DIALLED_NORM}" = "${WANTED_NORM}"]?go:deny)
 ; Out via the line the call came in on (the transferred channel keeps the endpoint's set_var
 ; values), else the first line. Per-profile transfer targets are a later step.
 same => n(go),Set(VIA=${IF($["${SPRECHSTUNDE_LINE}" != ""]?${SPRECHSTUNDE_LINE}:${ENV(SPRECHSTUNDE_FIRST_LINE)})})
 same => n,Dial(PJSIP/${WANTED}@provider-${VIA},60)
 same => n,Hangup()
 same => n(deny),Hangup(21)
