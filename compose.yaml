# Local telephony stack: provider <-TLS-> Asterisk <-UDP-> LiveKit SIP <-> LiveKit server <-> agent.
# Everything runs with host networking and binds to 127.0.0.1 (except Asterisk's provider leg).
# Ports: livekit 7880 + udp 50000-50100, sip 5060 + rtp 10000-10100,
#        asterisk 5070 + rtp 12000-12100, redis 6379, pocket-tts 8090.
services:
  redis:
    image: docker.io/valkey/valkey:8.1.10-trixie
    network_mode: host
    command: ["valkey-server", "--bind", "127.0.0.1", "--port", "6379", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  livekit:
    image: docker.io/livekit/livekit-server:v1.13.10
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro,z
    depends_on: [redis]
    restart: unless-stopped

  sip:
    image: docker.io/livekit/sip:v1.19.0
    network_mode: host
    environment:
      LIVEKIT_WS_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
    volumes:
      - ./deploy/sip.yaml:/sip/config.yaml:ro,z  # the image's entrypoint hardcodes --config=/sip/config.yaml
    depends_on: [redis, livekit]
    restart: unless-stopped

  asterisk:
    build:
      context: ./deploy/asterisk
      dockerfile: Containerfile
    image: localhost/sprechstunde-asterisk:22.10.1
    network_mode: host
    # Not `:?` — that would block `up redis livekit` without telephony credentials.
    # entrypoint.sh refuses to start when one is missing.
    environment:
      SIP_PROVIDER_HOST: "${SIP_PROVIDER_HOST:-}"
      SIP_PROVIDER_DOMAIN: "${SIP_PROVIDER_DOMAIN:-}"
      SIP_PROVIDER_USER: "${SIP_PROVIDER_USER:-}"
      SIP_PROVIDER_PASSWORD: "${SIP_PROVIDER_PASSWORD:-}"
      SIP_PROVIDER_NUMBER: "${SIP_PROVIDER_NUMBER:-}"
      SIP_PROVIDER_MEDIA_ENCRYPTION: "${SIP_PROVIDER_MEDIA_ENCRYPTION:-sdes}"
      TRANSFER_TARGET_NUMBER: "${TRANSFER_TARGET_NUMBER:-}"
      SIP_PUBLIC_ADDRESS: "${SIP_PUBLIC_ADDRESS:-}"
      SIP_PUBLIC_SIGNALING_ADDRESS: "${SIP_PUBLIC_SIGNALING_ADDRESS:-}"
      SIP_LOCAL_NET: "${SIP_LOCAL_NET:-}"
      SIP_RTP_START: "${SIP_RTP_START:-12000}"
      SIP_RTP_END: "${SIP_RTP_END:-12100}"
      SIP_PROVIDER_IPV6: "${SIP_PROVIDER_IPV6:-no}"
      SPRECHSTUNDE_ANSWER_TIMEOUT: "${SPRECHSTUNDE_ANSWER_TIMEOUT:-}"
    volumes:
      - ./deploy/asterisk/sounds:/opt/sprechstunde/sounds:ro,z  # `npm run fallback` records into it
    depends_on: [sip]
    restart: unless-stopped

  # Optional: Kyutai Pocket TTS on this machine's CPU (SPRECHSTUNDE_TTS_PROVIDER=pocket).
  # One worker = one answer being spoken at a time; 2 threads each. Measured on an i9-10900K:
  # 4 workers speaking at once kept up (1.3x real time), 6 did not. Measure on the real server.
  pocket-tts:
    profiles: ["pocket"]
    build:
      context: ./deploy/pocket-tts
      dockerfile: Containerfile
    image: localhost/sprechstunde-pocket-tts:3.3.0
    network_mode: host
    environment:
      POCKET_WORKERS: "${POCKET_WORKERS:-4}"
      POCKET_THREADS: "${POCKET_THREADS:-2}"
      POCKET_MAX_SESSIONS: "${POCKET_MAX_SESSIONS:-}"
      POCKET_VOICE: "${POCKET_VOICE:-juergen}"
    healthcheck:
      test: ["CMD", "python", "-c", "__import__('urllib.request').request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 30s
      start_period: 60s
    restart: unless-stopped

  # Optional: run the agent in a container instead of `npm run agent:dev` on the host.
  agent:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/sprechstunde-agent:0.1.0
    network_mode: host
    environment:
      LIVEKIT_URL: "${LIVEKIT_URL:-ws://127.0.0.1:7880}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      SPRECHSTUNDE_MISTRAL_SERVER: "${SPRECHSTUNDE_MISTRAL_SERVER:-}"
      SPRECHSTUNDE_PROFILE: "${SPRECHSTUNDE_PROFILE:-}"
      SPRECHSTUNDE_MODE: "${SPRECHSTUNDE_MODE:-echo}"
      TRANSFER_TARGET_NUMBER: "${TRANSFER_TARGET_NUMBER:-}"
      TRANSFER_SIP_HOST: "${TRANSFER_SIP_HOST:-}"
      SPRECHSTUNDE_AGENT_NAME: "${SPRECHSTUNDE_AGENT_NAME:-}"
      SPRECHSTUNDE_LLM_MODEL: "${SPRECHSTUNDE_LLM_MODEL:-}"
      SPRECHSTUNDE_LLM_FALLBACK_MODEL: "${SPRECHSTUNDE_LLM_FALLBACK_MODEL:-}"
      SPRECHSTUNDE_LLM_ATTEMPT_TIMEOUT: "${SPRECHSTUNDE_LLM_ATTEMPT_TIMEOUT:-}"
      SPRECHSTUNDE_STT_MODEL: "${SPRECHSTUNDE_STT_MODEL:-}"
      SPRECHSTUNDE_TTS_PROVIDER: "${SPRECHSTUNDE_TTS_PROVIDER:-}"
      SPRECHSTUNDE_TTS_MODEL: "${SPRECHSTUNDE_TTS_MODEL:-}"
      CARTESIA_API_KEY: "${CARTESIA_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      KUGELAUDIO_API_KEY: "${KUGELAUDIO_API_KEY:-}"
      SPRECHSTUNDE_KUGEL_REGION: "${SPRECHSTUNDE_KUGEL_REGION:-}"
      SPRECHSTUNDE_TTS_VOICE: "${SPRECHSTUNDE_TTS_VOICE:-}"
      SPRECHSTUNDE_TTS_NAME: "${SPRECHSTUNDE_TTS_NAME:-}"
      SPRECHSTUNDE_TTS_FALLBACK_PROVIDER: "${SPRECHSTUNDE_TTS_FALLBACK_PROVIDER:-}"
      SPRECHSTUNDE_TTS_FALLBACK_MODEL: "${SPRECHSTUNDE_TTS_FALLBACK_MODEL:-}"
      SPRECHSTUNDE_TTS_FALLBACK_VOICE: "${SPRECHSTUNDE_TTS_FALLBACK_VOICE:-}"
      SPRECHSTUNDE_TTS_FALLBACK_NAME: "${SPRECHSTUNDE_TTS_FALLBACK_NAME:-}"
      POCKET_TTS_URL: "${POCKET_TTS_URL:-}"
      # Debug only: stores what callers say. Leave empty in production.
      SPRECHSTUNDE_TRANSCRIPT_DIR: "${SPRECHSTUNDE_TRANSCRIPT_DIR:+/app/var/transcripts}"
    # Host uid = the image's `node` user, so the host dirs below stay writable for both sides.
    userns_mode: keep-id
    volumes:
      - ./var/metrics:/app/var/metrics:z
      - ./var/settings:/app/var/settings:z
      - ./var/voices:/app/var/voices:ro,z
      - ./var/profiles:/app/var/profiles:ro,z
      - ./var/transcripts:/app/var/transcripts:z
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      start_period: 30s
    depends_on: [livekit]
    restart: unless-stopped

  # The settings UI on 127.0.0.1:8091: pick the voice, compare presets, read the last calls'
  # latency. Same image as the agent, a separate process — reloading the page must never touch a
  # call in progress. It writes var/settings/voice.json, which the agent reads per call.
  admin:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/sprechstunde-agent:0.1.0
    command: ["node", "dist/admin/main.js"]
    network_mode: host
    environment:
      SPRECHSTUNDE_ADMIN_PORT: "${SPRECHSTUNDE_ADMIN_PORT:-8091}"
      SPRECHSTUNDE_PROFILE: "${SPRECHSTUNDE_PROFILE:-}"
      # Previews go to the same vendors a call would, so the UI needs their keys too.
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      SPRECHSTUNDE_MISTRAL_SERVER: "${SPRECHSTUNDE_MISTRAL_SERVER:-}"
      CARTESIA_API_KEY: "${CARTESIA_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      KUGELAUDIO_API_KEY: "${KUGELAUDIO_API_KEY:-}"
      SPRECHSTUNDE_KUGEL_REGION: "${SPRECHSTUNDE_KUGEL_REGION:-}"
      POCKET_TTS_URL: "${POCKET_TTS_URL:-}"
      SPRECHSTUNDE_TTS_PROVIDER: "${SPRECHSTUNDE_TTS_PROVIDER:-}"
      SPRECHSTUNDE_TTS_MODEL: "${SPRECHSTUNDE_TTS_MODEL:-}"
      SPRECHSTUNDE_TTS_VOICE: "${SPRECHSTUNDE_TTS_VOICE:-}"
      SPRECHSTUNDE_TTS_NAME: "${SPRECHSTUNDE_TTS_NAME:-}"
    userns_mode: keep-id
    volumes:
      - ./var/settings:/app/var/settings:z
      - ./var/voices:/app/var/voices:ro,z
      # Writable: the settings UI edits profiles and keeps their history in .history/. The agent mount stays read-only.
      - ./var/profiles:/app/var/profiles:z
      # Read-only: the UI reports the measurements, the agent is the one that writes them.
      - ./var/metrics:/app/var/metrics:ro,z
      # Only the admin opens the database; the agent reads the published <profile>.knowledge.md instead.
      - ./var/db:/app/var/db:z
    restart: unless-stopped
